name: OpenAPI Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Spectral
        run: |
          npm install -g @stoplight/spectral-cli

      - name: Create Ruleset
        run: |
          cat > .spectral.yaml <<EOF
          extends:
            - spectral:oas
          EOF

      - name: Install Reviewdog
        uses: reviewdog/action-setup@v1

      - name: Run Spectral
        run: |
          spectral lint openapi.yaml \
            --ruleset .spectral.yaml \
            --format stylish > spectral.out || true

      - name: Show Findings
        run: cat spectral.out

      - name: Reviewdog File-Level Comment
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog \
            -efm="%f:%l:%c %t %m" \
            -name="spectral" \
            -reporter=github-pr-review \
            -filter-mode=nofilter \
            -fail-on-error=false \
            -level=warning \
            < spectral.out
