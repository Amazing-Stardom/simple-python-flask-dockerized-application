name: OpenAPI Validation

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Spectral
        run: |
          npm install -g @stoplight/spectral-cli
          spectral --version

      - name: Show Spectral Help
        run: |
          spectral lint --help

      - name: Show Repository Files
        run: |
          pwd
          ls -la
          find . -type f | sort

      - name: Test Spectral SARIF
        run: |
          spectral lint openapi.yaml --format sarif

      - name: Generate SARIF
        run: |
          spectral lint openapi.yaml \
            --format sarif \
            --output results.sarif

      - name: Verify SARIF
        run: |
          ls -la

          if [ -f results.sarif ]; then
            echo "SARIF file created successfully"
            head -20 results.sarif
          else
            echo "SARIF file was not created"
            exit 1
          fi

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
