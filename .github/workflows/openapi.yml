openapi: 3.0.3

info:
  title: User Management API
  version: 1.0.0

servers:
  - url: https://api.example.com

paths:
  /users:
    get:
      operationId: getUsers

      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      operationId: createUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"

      responses:
        "201":
          description: User created

  /users/{id}:
    get:
      operationId: getUserById

      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /orders/{orderId}:
    get:
      operationId: getOrder

      responses:
        "200":
          description: Order found

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string

        email:
          type: string

        name:
          type: string

      required:
        - id

    CreateUserRequest:
      type: object

      properties:
        email:
          type: string

        name:
          type: string
