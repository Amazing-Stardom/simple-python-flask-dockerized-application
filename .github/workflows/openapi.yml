name: OpenAPI Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Create Spectral Ruleset
        run: |
          cat > .spectral.yaml << 'EOF'
          extends:
            - spectral:oas
          EOF

      - name: Validate OpenAPI and Generate SARIF
        run: |
          spectral lint openapi.yaml \
            --ruleset .spectral.yaml \
            --format sarif \
            --output results.sarif || true

      - name: Verify SARIF
        run: |
          ls -la

          if [ ! -f results.sarif ]; then
            echo "results.sarif was not generated"
            exit 1
          fi

          echo "SARIF generated successfully"
          head -20 results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
